<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="zk_wallet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>zk_wallet</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Periodically search DOM for inputs/buttons and tag them with data-test-id
    setInterval(() => {
      // 1. Tag inputs
      const inputs = document.querySelectorAll('input, textarea');
      inputs.forEach(el => {
        const label = (el.getAttribute('aria-label') || '').toLowerCase();
        const placeholder = (el.getAttribute('placeholder') || '').toLowerCase();
        const name = (el.getAttribute('name') || '').toLowerCase();
        
        if (label.includes('wallet address') || placeholder.includes('wallet address') || name.includes('wallet-address')) {
          el.setAttribute('data-test-id', 'wallet-address-input');
        } else if (label.includes('to address') || placeholder.includes('to address') || name.includes('to-address')) {
          el.setAttribute('data-test-id', 'to-address-input');
        } else if (label.includes('amount') || placeholder.includes('amount') || name.includes('amount')) {
          el.setAttribute('data-test-id', 'amount-input');
        } else if (label.includes('filter') || placeholder.includes('filter') || name.includes('filter')) {
          el.setAttribute('data-test-id', 'history-filter-input');
        }
      });

      // 2. Tag buttons
      const allElements = document.querySelectorAll('*');
      allElements.forEach(el => {
        const text = (el.textContent || '').trim();
        const label = (el.getAttribute('aria-label') || '').toLowerCase();
        
        if (text === 'Refresh' || label === 'refresh' || label.includes('refresh-button')) {
          el.setAttribute('data-test-id', 'refresh-button');
        }
        if (text === 'Submit Intent' || text === 'Submit' || label === 'submit-intent-button' || label.includes('submit-intent')) {
          el.setAttribute('data-test-id', 'submit-intent-button');
        }
      });
    }, 500);
  </script>
</body>
</html>
